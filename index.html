<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="고운고">
<meta name="application-name" content="고운고">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f4f6">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>고운고 1학년 학교생활</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* layout: 앱 스타일 — 연회색 바탕 위 흰 카드, 파란 포인트 하나, 정보 위계는 글자 굵기·크기로 */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#191f28; --ink2:#4e5968; --muted:#8b95a1; --line:#e5e8eb; --fill:#f9fafb;
  --accent:#2f6bff; --accent-soft:#eaf1ff; --hot:#f04452; --hot-soft:#fff0f1; --ok:#12b886;
  --cellS:75%; --cellL:90%; --cellInk:#333d4b;
  --radius:20px; --shadow:0 1px 2px rgba(0,27,55,.04);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:only light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top,0) 0 calc(72px + env(safe-area-inset-bottom,0))}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:12px}
h1,h2{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:18px}
.num{font-variant-numeric:tabular-nums}

/* 상단 바 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 4px 4px}
.top h1{font-size:22px}
.top-r{display:flex;align-items:center;gap:8px}
.wk{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rf{border:0;background:var(--surface);color:var(--ink2);width:34px;height:34px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.rf svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rf:active{background:var(--line)}
.rf:focus-visible,.tab:focus-visible,.bus-btn:focus-visible,.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 카드 공통 */
.card,.hero{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);scroll-margin-top:12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.card-h span{font-size:13px;color:var(--muted);font-weight:500}
.card-h h2{display:flex;align-items:center;gap:8px}
.card-h h2 i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--c)}
.card-h h2 i svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* 오늘 카드 */
.hero{display:flex;flex-direction:column;gap:16px;background:linear-gradient(160deg,#3a7bff 0%,#2457e6 100%);color:#fff;box-shadow:0 8px 24px rgba(36,87,230,.25)}
.hero .hi{font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.02em;display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-variant-numeric:tabular-nums}
.hero .hi .tag{font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:99px}
.hero .hi small{flex-basis:100%;font-size:14px;font-weight:600;opacity:.85}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wx{display:flex;align-items:center;gap:6px;flex:none;text-align:right}
.wx[hidden]{display:none}
.wx .ic{width:34px;height:34px;flex:none;background:rgba(255,255,255,.95);border-radius:12px;padding:3px}
.wx .ic svg{width:100%;height:100%}
.wx .t{display:flex;flex-direction:column;line-height:1.2}
.wx .t b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.wx .t span{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.umb{margin-top:-4px;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.18);padding:9px 12px;border-radius:12px}
.quote{font-size:13px;color:rgba(255,255,255,.85);line-height:1.55;display:flex;gap:8px;align-items:flex-start;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.quote .qi{width:16px;height:16px;flex:none;margin-top:2px;stroke:rgba(255,255,255,.7);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.quote small{display:inline;font-size:11px;color:rgba(255,255,255,.65);margin-left:6px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{text-align:center;padding:10px 4px;background:rgba(255,255,255,.14);border-radius:14px}
.stat .num{font-size:22px;font-weight:700;line-height:1.2;display:block}
.stat:last-child{background:#fff}
.stat:last-child .num{color:#f03e3e}
.stat:last-child span{color:var(--muted)}
.stat span{display:block;font-size:12px;color:rgba(255,255,255,.8);margin-top:2px}

/* 일정 */
.ev{display:flex;flex-direction:column}
.ev-row{display:grid;grid-template-columns:68px 1fr;gap:14px;align-items:center;padding:10px 0}
.ev-row+.ev-row{border-top:1px solid var(--line)}
.dd{text-align:center;background:var(--accent-soft);border-radius:12px;padding:8px 0 6px}
.dd .num{font-size:17px;font-weight:700;color:var(--accent);display:block;line-height:1.2}
.dd.soon{background:var(--hot-soft)}
.dd.soon .num{color:var(--hot)}
.dd small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev-row b{display:block;font-size:15px;font-weight:600}
.ev-row p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ev-row.exam b{color:#f03e3e}
.ev-row b{display:flex;align-items:center;gap:6px}
.evi{display:inline-grid;place-items:center;width:20px;height:20px;flex:none}
.evi svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.exbar{margin-top:8px;height:6px;border-radius:3px;background:#ffe3e3;overflow:hidden}
.exbar i{display:block;height:100%;border-radius:3px;background:#f03e3e}
.ev-row p.exl{font-size:11px;margin-top:4px}

/* 시간표 */
.tt{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;margin:-3px}
.tt th{font-size:13px;font-weight:700;color:var(--ink);padding:0 0 6px}
.tt th.pc{width:16px}
.tt th .num{display:inline-block;font-size:15px;font-weight:700;color:var(--ink);margin-top:2px;min-width:26px;padding:1px 0;border-radius:8px}
.tt th.today{color:var(--accent)}
.tt th.today .num{background:var(--accent);color:#fff}
.tt td{height:44px;border-radius:10px;font-size:12px;font-weight:500;line-height:1.25;text-align:center;padding:4px 2px;word-break:keep-all;position:relative;
  background:hsl(var(--h) var(--cellS) var(--cellL));color:var(--cellInk)}
.tt td.empty{background:var(--fill)}
.tt td.off{background:var(--fill);color:var(--muted);font-size:12px}
.tt td.off.exam{background:#fff;border:1px solid #ffc9c9;color:#f03e3e;font-weight:700}
.tt td.pa::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--hot)}
.tt td{font-size:14px;font-weight:700}
.tt td.dim,.tt th.dim{opacity:.45}
.tt td.tday{box-shadow:inset 0 0 0 2px var(--accent)}
.tt th.tday .num{background:var(--accent);color:#fff}
.tt .pnum{font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{width:6px;height:6px;border-radius:50%;background:var(--hot)}

/* 버스 */
.bus-path{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.bus-path b{color:var(--ink);font-size:14px;font-weight:600}
.bus-path .arr{color:var(--muted)}
.bus-list{display:flex;flex-direction:column}
.bus-row{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px 0}
.bus-row+.bus-row{border-top:1px solid var(--line)}
.bus-no{font-size:17px;font-weight:700;color:#fff;background:#2fb344;border-radius:10px;text-align:center;padding:6px 0;font-variant-numeric:tabular-nums}
.bus-t{font-size:14px}
.bus-t b{font-size:14px;font-weight:600}
.bus-path .est{margin-left:auto;color:#e03131;font-size:12px;font-weight:600}
.bus-t small{display:block;font-size:12px;color:var(--muted)}
.bus-times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0}
.bus-times span{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);background:var(--fill);border:1px solid var(--line);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.2}
.bus-times span.past{color:#c4cad1;background:transparent;border-color:transparent;text-decoration:line-through;font-weight:400}
.bus-times span.next{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.bus-times span.best{background:var(--accent);border-color:var(--accent);color:#fff}
.bus-times em{font-style:normal;font-size:11px;font-weight:600;opacity:.9}
.bus-times em.hurry{opacity:1;color:#fff;background:#f03e3e;border-radius:6px;padding:0 5px;margin-top:2px}
.bus-times span.past{border-color:var(--line);background:transparent}
.bus-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;padding:13px;border:0;border-radius:14px;background:var(--accent-soft);color:var(--accent);font:700 15px var(--font);cursor:pointer}
.bus-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bus-btn.spin svg{animation:ptr .7s linear infinite}
.bus-btn small{font-weight:500;font-size:12px;opacity:.8}
.bus-btn:active{filter:brightness(.97)}

.live{margin-top:0}
.live:empty{display:none}
.track{display:flex;align-items:center;gap:0;padding:4px 0;position:relative}
.bc-s em.turn{display:block;font-style:normal;font-size:11px;font-weight:700;color:#e67700;margin-top:2px}
.track .bm{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(0,0,0,.08);opacity:0}
.track .bm.on{opacity:1;transition:left 1s linear}
.track .st{width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid #c4cad1;flex:none;position:relative}
.track .ln{flex:1;height:2px;background:#d1d6db;min-width:8px}
.track.mini{padding:5px 2px}
.track.mini .ln{min-width:4px}
.track.mini .st{width:9px;height:9px}
.track.mini .st.bus{width:13px;height:13px;background:currentColor;border-color:currentColor;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.track.mini .st.goal{border-color:var(--accent)}
.track .st.goal{width:14px;height:14px;border-color:var(--accent);border-width:3px}
.track .st.bus{background:#f03e3e;border-color:#f03e3e;width:14px;height:14px;box-shadow:0 0 0 4px #ffe3e3}
.track .gl{margin-left:6px;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.lmsg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:4px}
.lmsg i{width:8px;height:8px;border-radius:50%;background:#f03e3e;flex:none}
.lmsg i.off{background:#c4cad1}
.lmsg b{color:#f03e3e;font-weight:700}
.lmsg span{color:var(--muted);font-size:12px;margin-left:2px}
.lmsg em{font-style:normal;color:var(--muted)}
.bus-go .go{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:16px;margin-bottom:10px}
.go em{display:none;font-style:normal;align-self:flex-start;font-size:12px;font-weight:800;color:inherit;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1.5px currentColor;border-radius:7px;padding:2px 8px;margin-bottom:4px}
.go b{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.go span{font-variant-numeric:tabular-nums}
.go span.now{color:var(--ink);font-weight:600;opacity:1}
.go b small{font-size:17px;font-weight:700}
.go span{font-size:13px;font-weight:500;opacity:.9}
.go.green{background:#e6fcf5;color:#087f5b}
.go.amber{background:#fff4e6;color:#d9480f}
.go.red{background:#fff0f0;color:#e03131}
.go.gray{background:var(--fill);color:var(--muted)}
.bus-list[hidden]{display:none}
.bus-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bc{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.bc-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bc .bus-no{font-size:14px;padding:3px 8px;border-radius:8px}
.bc-at{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bc-m{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.bc-m small{font-size:15px;font-weight:700;margin-left:2px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:currentColor}
.bc-s{font-size:12px;color:var(--ink2);font-weight:600}
.bc-s span{display:block;font-weight:400;color:var(--muted);font-size:11px}
.bc.none{opacity:.45;background:var(--fill)}
.bc.none .bus-no{background:#adb5bd}
.bc.green{color:#0ca678}.bc.amber{color:#f76707}.bc.red{color:#f03e3e}.bc.none{color:#c4cad1}
.bc .bc-s,.bc .bc-at{color:var(--ink2)}
.bc.none .bc-s{color:var(--muted)}
.bus-offmsg{display:none}
.bus-off .bus-offmsg{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:16px;background:var(--fill)}
.bus-offmsg b{font-size:15px;font-weight:700;color:var(--ink2)}
.bus-offmsg span{font-size:13px;color:var(--muted)}
.bus-off .bus-go,.bus-off .bus-grid,.bus-off .bus-btn{display:none}
.card-h h2 .clock{font-size:inherit;font-weight:inherit;color:inherit;margin-left:2px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--fill);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;font:700 13px var(--font);color:var(--muted);padding:5px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.tab-pm>.bus-path,.tab-pm>.bus-offmsg,.tab-pm>.bus-go,.tab-pm>.bus-grid,.tab-pm>.bus-btn{display:none!important}
.pm-empty{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:16px;background:var(--fill);border:1px dashed #d1d6db}
.pm-empty b{font-size:15px;color:var(--ink2)}
.pm-empty span{font-size:13px;color:var(--muted);line-height:1.5}
.bus-grid.one{grid-template-columns:1fr}
.dests{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);color:var(--ink2)}
.dests small{flex-basis:100%;font-size:11px;color:var(--muted)}
.dest{font-size:13px}
.dest b{color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
/* 급식 */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mday{flex:0 0 31%;min-width:108px;max-width:140px;scroll-snap-align:start;border-radius:14px;padding:12px 10px;background:var(--fill);border:1px solid transparent}
.mday.today{background:var(--accent-soft);border-color:var(--accent);flex-basis:56%;max-width:220px}
.mday.today .meal li{font-size:14px}
.mday.today .meal li:first-child{font-size:17px}
.mday h3 .nx{font-style:normal;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:1px 6px;margin-left:auto}
.meal li.fav::before{content:"★";color:#f59f00;margin-right:3px;font-size:.9em}
.mday h3{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:4px}
.mday.today h3{color:var(--accent)}
.mday h3 small{font-size:11px;color:var(--muted);font-weight:500}
.meal+.meal{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.mh b{font-size:11px;font-weight:700;color:#f76707}
.meal+.meal .mh b{color:#7048e8}
.mh span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal ul{margin:0;padding:0;list-style:none}
.meal li{font-size:13px;line-height:1.5;color:var(--ink2);overflow-wrap:anywhere}
.meal li:first-child{font-weight:700;color:var(--ink)}
.nomeal{font-size:13px;color:var(--muted)}

/* 수행 */
.pa-list{display:flex;flex-direction:column}
.pa-item{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;padding:14px 0}
.pa-head{cursor:pointer}
.pa-item+.pa-item{border-top:1px solid var(--line)}
.pa-item.done{opacity:.45;padding:10px 0}
.pa-item.done .pa-name,.pa-item.done .tip,.pa-item.done .more{display:none}
.subj .due{font-style:normal;font-size:11px;font-weight:700;color:#fff;background:#f03e3e;border-radius:6px;padding:1px 6px;margin-left:4px}
.ring{display:inline-flex;align-items:center;gap:6px}
.ring svg{width:34px;height:34px}
.ring b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.ring span{font-size:12px;color:var(--muted)}
.pa-item.done .subj,.pa-item.done .pa-name{text-decoration:line-through}
.chk{appearance:none;width:24px;height:24px;margin:1px 0 0;border-radius:50%;border:2px solid #d1d6db;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pa-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.subj{font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.subj::before{content:"";width:8px;height:8px;border-radius:3px;background:hsl(var(--h) 60% 55%)}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pa-name{font-size:14px;color:var(--ink2);margin:0 0 8px}
.tip{font-size:13px;line-height:1.55;color:var(--ink2);background:hsl(var(--h) 80% 96%);border-radius:12px;padding:10px 12px}
.tip b{display:block;color:#e03131;font-weight:700;font-size:12px;margin-bottom:2px}

.more{margin-top:8px}
.more summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:4px;padding:4px 0}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px)}
.more[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.more summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.lv,.ck{margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--ink2)}
.lv b,.ck b{display:block;font-size:12px;color:var(--ink);margin-bottom:4px}
.lv small,.ck small{display:block;margin-top:6px;font-size:11px;color:var(--muted)}
.ck ul{margin:0;padding:0;list-style:none}
.ck li{position:relative;padding-left:20px}
.ck li::before{content:"";position:absolute;left:2px;top:5px;width:11px;height:11px;border:1.5px solid #c4cad1;border-radius:3px}
/* 기말고사 플래너 */
.card-h h2 .ex-dd{margin-left:8px;font-size:inherit;color:var(--hot);font-weight:800}
.ex-all{font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.ex-all small{font-size:11px;color:var(--muted);font-weight:600;margin-right:4px}
.ex-top{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.ex-today{background:var(--hot-soft);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.ex-today h3{margin:0 0 4px;font-size:12px;font-weight:800;color:var(--hot)}
.ex-rec{display:flex;align-items:baseline;gap:8px;width:100%;border:0;background:none;padding:5px 0;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.ex-rec .no{flex:none;width:18px;height:18px;border-radius:50%;background:var(--hot);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;transform:translateY(2px)}
.ex-rec b{font-size:14px;flex:none}
.ex-rec span{font-size:13px;color:var(--ink2);min-width:0}
.ex-rec em{font-style:normal;font-weight:700;color:var(--hot)}
.ex-msg{font-size:13px;color:var(--ink2);padding:4px 0}
.exs{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.exs-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.exs-n{flex:1;min-width:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.exs-n::before{content:"";width:8px;height:8px;border-radius:3px;background:hsl(var(--h) 60% 55%);flex:none}
.exs-w{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--fill);color:var(--ink2);border:1px solid var(--line)}
.exs-w.big{background:var(--hot-soft);color:var(--hot);border-color:#ffc9c9}
.exs-d{font-size:12px;color:var(--muted);white-space:nowrap}
.exs-p{font-size:13px;font-weight:800;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.exs-bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.exs-bar i{display:block;height:100%;background:hsl(var(--h) 60% 55%);border-radius:2px}
.exs-more{display:none;margin-top:8px}
.exs.open .exs-more{display:block}
.exs.fin{opacity:.5}
.exs-meta{font-size:12px;color:var(--ink2);margin:0 0 4px}
.ex-task{display:flex;align-items:center;gap:10px;padding:7px 0}
.ex-task+.ex-task{border-top:1px solid rgba(240,68,82,.15)}
.ex-tx{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.4}
.ex-tx b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:hsl(var(--h) 60% 55%);margin-right:6px;transform:translateY(-1px)}
.ex-tx em{font-style:normal;font-weight:700;color:var(--hot);white-space:nowrap}
.ex-did{flex:none;border:0;border-radius:10px;padding:8px 14px;background:var(--hot);color:#fff;font:700 13px var(--font);cursor:pointer}
.ex-task.done .ex-tx{color:var(--muted);text-decoration:line-through}
.ex-task.done .ex-tx em{color:var(--muted)}
.ex-task.done .ex-did{background:var(--surface);color:var(--ok);border:1px solid var(--line)}
.ex-ok{font-size:12px;font-weight:700;color:var(--ok)}
.ex-fin{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:8px;border-top:1px solid rgba(240,68,82,.15);font-size:14px;font-weight:700;color:var(--ok)}
.exs-dots{display:flex;gap:3px;color:hsl(var(--h) 55% 50%);flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.dt{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box;flex:none;vertical-align:-1px}
.dt.l1{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.dt.l2{background:currentColor}
.exs-leg{color:var(--muted)}.exs-leg .dt{color:hsl(var(--h) 55% 50%)}
.exs-leg{font-size:12px;color:var(--muted);margin:0 0 4px}
.exu2{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px dashed var(--line);background:none;padding:10px 0;text-align:left;font:14px var(--font);color:var(--ink);cursor:pointer}
.exu2 .dt{width:20px;height:20px;border-width:2px;color:#c4cad1}
.exu2.l1 .dt,.exu2.l2 .dt{color:hsl(var(--h) 60% 50%)}
.exu2.l2 span{color:var(--muted)}
.ro .exu2{cursor:default}
.exs-tip{font-size:12px;line-height:1.5;color:var(--ink2);background:hsl(var(--h) 80% 96%);border-radius:10px;padding:8px 10px;margin:4px 0 6px}
.exu{padding:8px 0;border-top:1px dashed var(--line)}
.exu-n{font-size:13px;color:var(--ink);margin-bottom:6px}
.exu-c{display:flex;gap:6px}
.exc{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;font:600 12px var(--font);color:var(--muted);cursor:pointer}
.exc.on{background:hsl(var(--h) 60% 52%);border-color:transparent;color:#fff}
.ro .exc{cursor:default}
.exs-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink2)}
.exs-tools select{font:600 12px var(--font);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--surface);margin-left:4px}
.ex-btn{border:0;background:var(--fill);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:600 12px var(--font);color:var(--ink2);cursor:pointer}
.ex-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.exs textarea{width:100%;min-height:120px;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:8px;font:13px/1.6 var(--font);color:var(--ink);box-sizing:border-box}
.exs .ed-row{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.ex-note{font-size:11px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.ex-share{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.ex-share b{color:var(--ink2)}
.ex-share>span:last-child{display:flex;gap:6px;flex:none}
.exs-tools span{color:var(--muted)}
.pk{display:flex;gap:6px;align-items:center;margin-top:14px;font-size:13px;color:var(--ink2)}
.pk input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:14px var(--font)}
/* 수행: 마감 보드 + 단계 */
.pg+.pg{margin-top:14px}
.pg h3{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:13px;font-weight:700;color:var(--ink2)}
.pg h3 i{width:8px;height:8px;border-radius:50%}
.pg.hot h3 i{background:#f03e3e}.pg.ing h3 i{background:#f59f00}.pg.fin h3 i{background:#12b886}
.pg h3 span{font-size:12px;color:var(--muted);font-weight:600}
.pi{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;background:var(--surface);display:flex;flex-direction:column}
.pi .pi-more{order:1}
.pg.hot .pi{border-color:#ffc9c9;background:#fffafa}
.pi-row{display:flex;align-items:center;gap:10px}
.pi-main{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column}
.pi-sub{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.pi-sub::before{content:"";width:8px;height:8px;border-radius:3px;background:hsl(var(--h) 60% 55%)}
.pi-tt{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.pi-r em{font-style:normal;font-size:12px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.pi-r em.hot{color:#f03e3e}
.pi-r small{font-size:11px;color:var(--muted)}
.pi-prog{height:4px;border-radius:2px;background:var(--line);margin:8px 0 0 36px;overflow:hidden}
.pi-prog i{display:block;height:100%;background:#7048e8;border-radius:2px}
.pi-more{display:none;margin:10px 0 2px 36px}
.pi.open .pi-more{display:block}
.pi.done{opacity:.55}.pi.done .pi-tt{text-decoration:line-through}
.steps{display:flex;align-items:center;gap:0;margin-bottom:8px}
.stp{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--font);color:var(--muted);cursor:pointer;flex:none}
.stp b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid #d1d6db;color:var(--muted);font-size:12px;background:var(--surface)}
.stp.on{color:#7048e8}.stp.on b{background:#7048e8;border-color:#7048e8;color:#fff}
.steps .sl{flex:1;height:2px;background:var(--line);margin:0 2px 16px;min-width:8px}
.pi-period{font-size:12px;color:var(--muted);margin:0 0 8px}
.pi-more .tip,.pi-more .lv,.pi-more .ck{margin-top:6px}
.pi-tog{display:flex;align-items:center;justify-content:center;gap:4px;width:calc(100% - 36px);margin:8px 0 0 36px;padding:7px 0;border:0;border-radius:10px;background:var(--fill);color:#7048e8;font:600 12px var(--font);cursor:pointer}
.pi-tog svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.pi.open .pi-tog{background:#f3f0ff}
.pi.open .pi-tog svg{transform:rotate(180deg)}
.pi.open .pi-tog{order:2}
.pi.done .pi-tog{display:none}
.pi-r{cursor:pointer}
.pi:active{transform:scale(.995)}
.pm-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.cp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--fill);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.cp svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.cp.hot{color:#e03131;border-color:#ffc9c9;background:#fff5f5}
.pm{display:grid;grid-template-columns:52px 1fr;gap:10px 10px;margin:0;padding:12px;border-radius:12px;background:var(--fill)}
.pm dt{font-size:11px;font-weight:700;color:var(--muted);padding-top:2px}
.pm dd{margin:0;font-size:13px;line-height:1.5;color:var(--ink)}
.pm .kw{display:block;color:#e03131;font-size:12px;font-weight:800;margin-bottom:1px}
.pm .sub{display:block;font-size:12px;line-height:1.55;color:var(--ink2);margin-top:6px;padding:7px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.pm .sub b{font-weight:800;color:var(--ink)}
.pm .cl{display:flex;flex-direction:column;gap:4px}
.ci{display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;font:500 13px var(--font);color:var(--ink);text-align:left;cursor:pointer}
.ci i{width:16px;height:16px;border-radius:5px;border:1.5px solid #c4cad1;flex:none;display:grid;place-items:center;background:var(--surface)}
.ci.on{color:var(--muted);text-decoration:line-through}
.ci.on i{background:#7048e8;border-color:#7048e8}
.ci.on i::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* 하단 탭바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0))}
.tabbar nav{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab[hidden]{display:none}
.tab{border:0;background:none;font:500 11px var(--font);color:#b0b8c1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;border-radius:10px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* 화면 편집 */
.user-hidden{display:none!important}
.edit-btn{align-self:center;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font:600 13px var(--font);padding:10px 14px;border-radius:12px;cursor:pointer}
.edit-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.edit-btn:active{background:var(--line)}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px calc(16px + env(safe-area-inset-bottom,0));max-height:85vh;overflow:auto}
.sheet-h{margin-bottom:12px}
.sheet-h span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ed-list{list-style:none;margin:0;padding:0}
.ed-list li{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.ed-list li .nm{flex:1;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.ed-list li .nm i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.ed-list li.off .nm{color:#c4cad1}
.ed-list button{width:38px;height:38px;border:0;border-radius:10px;background:var(--fill);color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.ed-list button:disabled{opacity:.3}
.ed-list button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ed-list li.off button.eye{color:#c4cad1}
.sheet-f{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:16px}
.sheet-f button{border:0;border-radius:14px;padding:14px;font:700 15px var(--font);cursor:pointer}
.sheet-f .ghost{background:var(--fill);color:var(--ink2)}
.sheet-f .primary{background:var(--accent);color:#fff}
.ed-list button:focus-visible,.sheet-f button:focus-visible,.edit-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 당겨서 새로고침 */
html,body{overscroll-behavior-y:contain}
.ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) - 30px);left:50%;transform:translate(-50%,0);z-index:40;width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center;opacity:0;pointer-events:none;color:var(--muted)}
.ptr svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ptr.ready{color:var(--accent)}
.ptr.spin svg{animation:ptr .7s linear infinite}
@keyframes ptr{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">고운고 1학년 1반</h1>
  </header>

  <section class="hero" id="sec-today">
    <div class="hero-top"><div class="hi" id="hi"></div><div class="wx" id="wx" hidden></div></div>
    <div class="stats" id="stats"></div>
    <div class="quote" id="quote"></div>
  </section>

  <section class="card" id="sec-ev">
    <div class="card-h"><h2><i style="--c:#f04452"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/></svg></i>다가오는 일정</h2></div>
    <div class="ev" id="ev"></div>
  </section>

  <section class="card" id="sec-tt">
    <div class="card-h"><h2><i style="--c:#2f6bff"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg></i>이번 주 시간표</h2><span id="ttRange"></span></div>
    <table class="tt" id="tt"></table>
  </section>

  <section class="card" id="sec-bus">
    <div class="card-h"><h2><i style="--c:#2fb344"><svg viewBox="0 0 24 24"><path d="M6 4h12a2 2 0 0 1 2 2v10H4V6a2 2 0 0 1 2-2zM4 12h16M8 20v-4M16 20v-4"/></svg></i>버스<span class="clock" id="busClock"></span></h2><div class="seg" role="tablist" aria-label="등교·하교 선택"><button type="button" role="tab" data-tab="am" id="tabAm">등교</button><button type="button" role="tab" data-tab="pm" id="tabPm">하교</button></div></div>
    <div class="bus-pm" id="busPm" hidden></div>
    <div class="bus-path" id="busPath"></div>
    <div class="bus-offmsg" id="busOff"></div>
    <div class="bus-go" id="busGo"></div>
    <div class="bus-grid" id="busGrid"></div>
    <div class="bus-list" id="busList" hidden></div>
    <button type="button" class="bus-btn" id="busRefresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg><span id="busRefreshTxt">새로고침</span></button>
  </section>

  <section class="card" id="sec-meal">
    <div class="card-h"><h2><i style="--c:#f76707"><svg viewBox="0 0 24 24"><path d="M4 13h16a8 8 0 0 1-16 0zM9 9c0-2 2-2 2-4M14 9c0-2 2-2 2-4"/></svg></i>오늘 뭐 먹지?</h2></div>
    <div class="strip" id="meal"></div>
  </section>

  <section class="card" id="sec-exam" hidden>
    <div class="card-h"><h2><i style="--c:#f04452"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg></i>기말고사<span class="ex-dd" id="exDd"></span></h2><span class="ex-all" id="exAll"></span></div>
    <div id="exam"></div>
  </section>

  <section class="card" id="sec-pa">
    <div class="card-h"><h2><i style="--c:#7048e8"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></i>이번 주 수행 체크</h2><span class="ring" id="paRing"></span></div>
    <div class="pa-list" id="pa"></div>
  </section>

  <button class="edit-btn" id="editBtn" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h10M4 12h16M4 17h7"/><circle cx="17" cy="7" r="2"/><circle cx="14" cy="17" r="2"/></svg>화면 편집</button>

</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-h"><h2 id="sheetTitle">화면 편집</h2><span>순서를 바꾸거나 숨길 수 있어</span></div>
    <ul class="ed-list" id="edList"></ul>
    <div class="pk"><span>부모님 보기</span><input id="pkIn" type="password" autocomplete="off" placeholder="부모님 휴대폰에서만 비밀번호 입력" aria-label="부모님 보기 비밀번호"><button type="button" class="ex-btn" id="pkSave">저장</button></div>
    <div class="sheet-f"><button type="button" class="ghost" id="edReset">처음대로</button><button type="button" class="primary" id="edDone">완료</button></div>
  </div>
</div>

<div class="tabbar"><nav aria-label="바로가기">

  // 공식 도착정보(초)가 없으면 '남은 정거장 × 1정거장 시간'으로 초를 만든 뒤, 똑같이 보정을 적용 (예전엔 이 경우 보정이 빠져 있었음)
  const P=per||STOP_MIN*60;
  let sec=(b.sec!=null&&!isNaN(b.sec))?+b.sec:(b.left||0)*P;
  const el=t?Math.max(0,(Date.now()-Date.parse(t))/1000):0;
  let rem=sec-el-lag;
  if(b.est||b.sec==null)rem=Math.max(((b.left||1)-1)*P,rem);  // 정거장 수로 계산한 버스: 아직 안 지난 정거장만큼은 남겨 둠
  return Math.max(0,Math.floor(rem/60));}
// 정거장 수로 계산하는 버스(공식 도착정보 없음)는 '이 정거장 수로 처음 보인 시각'부터 줄어들게
// → 새로고침해도 같은 정거장이면 시간이 다시 늘어나지 않음
const ANCH=(()=>{try{const o=JSON.parse(localStorage.getItem("busAnch")||"{}"),n=Date.now();Object.keys(o).forEach(k=>{if(n-Date.parse(o[k])>6e5)delete o[k];});return o;}catch(_){return{};}})();
function anchor(j,tab){
  const per=j.perStop||STOP_MIN*60, seen={};
  (j.routes||[]).forEach(r=>(r.buses||[]).concat(r.next?[r.next]:[]).forEach(b=>{
    if(b.sec!=null&&!isNaN(b.sec)&&!b.est)return;  // 공식 도착정보는 그대로 믿음
    const k=tab+"|"+r.no+"|"+b.left;seen[k]=1;
    if(!ANCH[k])ANCH[k]=j.time;
    const el0=Math.max(0,(Date.parse(j.time)-Date.parse(ANCH[k]))/1000);
    b.sec=Math.max((b.left-1)*per,b.left*per-el0);b.est=true;
  }));
  Object.keys(ANCH).forEach(k=>{if(k.startsWith(tab+"|")&&!seen[k])delete ANCH[k];});
  try{localStorage.setItem("busAnch",JSON.stringify(ANCH));}catch(_){}
}
function trackHTML(bs,N,t,per,lag,kp){ // 정류장 앞 N정거장 노선 + 버스(정류장 사이에서도 움직이게)
  let h="";for(let k=N;k>=1;k--)h+=`<span class="st"></span><span class="ln"></span>`;
  const ms=bs.filter(b=>b.left>=1&&b.left<=N).map(b=>`<span class="bm" data-k="${kp||""}|${b.left}" data-left="${b.left}" data-sec="${b.sec!=null&&!isNaN(b.sec)?b.sec:""}" data-t="${t||""}" data-per="${per||STOP_MIN*60}" data-lag="${lag||0}"></span>`).join("");
  return `<div class="track mini" data-n="${N}">${h}<span class="st goal"></span>${ms}</div>`;
}
// 버스 위치(남은 정거장, 소수점) = 남은 시간 ÷ 1정거장 시간. 단, '마지막으로 지난 정류장'과 그다음 정류장 사이에서만 움직임
function busPos(m){
  const L=+m.dataset.left, per=+m.dataset.per||90, lag=+m.dataset.lag||0, t=m.dataset.t;
  const el=t?Math.max(0,(Date.now()-Date.parse(t))/1000):0;
  const sec=m.dataset.sec!==""?+m.dataset.sec:L*per;
  return Math.max(L-1+0.08,Math.min(L,(sec-el-lag)/per));
}
// 버스 점은 앞으로만 움직임: 같은 버스(탭·노선·정거장)의 마지막 위치를 기억해서 그보다 뒤로는 안 감
const BPOS=(()=>{try{const o=JSON.parse(localStorage.getItem("busPos")||"{}"),n=Date.now();Object.keys(o).forEach(k=>{if(n-o[k].at>12e4)delete o[k];});return o;}catch(_){return{};}})();
let bposT=0;
function placeBuses(){
  const now=Date.now();
  document.querySelectorAll(".track[data-n]").forEach(tr=>{
    const st=tr.querySelectorAll(".st"), N=+tr.dataset.n, base=tr.getBoundingClientRect().left;
    const cx=k=>{const r=st[N-k].getBoundingClientRect();return r.left+r.width/2-base;};
    tr.querySelectorAll(".bm").forEach(m=>{let p=busPos(m);const k=m.dataset.k, old=BPOS[k];
      if(old&&now-old.at<12e4)p=Math.min(p,old.p);  // 되돌아가지 않기
      BPOS[k]={p,at:now};
      const hi=Math.ceil(p), lo=Math.max(0,hi-1), x=(cx(hi)+(cx(lo)-cx(hi))*(hi-p)).toFixed(1)+"px";
      if(!m.classList.contains("on")){m.style.left=x;void m.offsetWidth;m.classList.add("on");}  // 처음엔 미끄러지지 않고 제자리에 바로
      else m.style.left=x;});
  });
}
setInterval(()=>{if(document.visibilityState!=="visible")return;placeBuses();
  if(Date.now()-bposT>5000){bposT=Date.now();try{localStorage.setItem("busPos",JSON.stringify(BPOS));}catch(_){}}},1000);
addEventListener("pagehide",()=>{try{localStorage.setItem("busPos",JSON.stringify(BPOS));localStorage.setItem("busAnch",JSON.stringify(ANCH));}catch(_){}});
const WALK=5; // 집 → 정류장 걷는 시간(분)
function drawLive(){
  const lines=(DATA.bus&&DATA.bus.lines)||{}, MAXS=8, NEAR=5, routes=(DATA.bus&&DATA.bus.routes||[]).map(r=>r.no);
  const fmt=d=>`${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
  if(!LIVE){
    $("busGo").innerHTML=(DATA.bus&&DATA.bus.live)?`<div class="go gray"><b>${LIVE_ERR?"실시간 연결 안 됨":"불러오는 중…"}</b>${LIVE_ERR?`<span>${esc(LIVE_ERR)}</span>`:""}</div>`:"";
    $("busGrid").innerHTML="";return;
  }
  const now=Date.now(), cards=[], cands=[];
  routes.forEach(no=>{
    const n=Math.min(MAXS,(lines[no]||[]).length||MAXS);
    const r=(LIVE.routes||[]).find(x=>x.no===no);
    const bs=(r?r.buses:[]).filter(b=>b.left<=n).sort((a,b)=>a.left-b.left);
    const near=bs[0]||(r&&r.next?Object.assign({at:""},r.next,{far:true}):null);
    if(near){
      const m=busMin(near,LIVE.time,LAG_SEC,LIVE.perStop), at=new Date(now+m*60000);
      cands.push({no,m,at});
      const lv=m<=5?"red":(m<=10?"amber":"green"), pct=Math.round((n-near.left)/n*100);
      cards.push(`<div class="bc ${lv}${near.left>NEAR?" far":""}"><div class="bc-h"><span class="bus-no">${esc(no)}</span><span class="bc-at">${fmt(at)} 도착</span></div>
        <div class="bc-m">${m===0?"도착":`${m}<small>분</small>`}</div>
        ${near.left<=NEAR?trackHTML(bs,NEAR,LIVE.time,LIVE.perStop,LAG_SEC,"am|"+no):`<div class="bar"><i style="width:${Math.max(0,pct)}%"></i></div>`}
        <div class="bc-s">${near.left===0?"정류장에 있음":`${near.left}정거장 전`}<span>${near.far?esc(near.at||""):esc((lines[no]||[])[n-near.left]||near.at)}</span>${near.turn?`<em class="turn">회차 전 · 늦을 수 있음</em>`:""}</div></div>`);
    }else{
      cards.push(`<div class="bc none"><div class="bc-h"><span class="bus-no">${esc(no)}</span></div><div class="bc-m">–</div><div class="bar"><i style="width:0"></i></div><div class="bc-s">운행 정보 없음</div></div>`);
    }
  });
  // 행동 안내: 걸어서 탈 수 있는 가장 빠른 버스
  cands.sort((a,b)=>a.m-b.m);
  const ok=cands.find(c=>c.m>=WALK), hurry=cands.find(c=>c.m>=WALK-1);
  let go;
  const nowS=fmt(new Date(now));
  const box=(cls,tag,c)=>`<div class="go ${cls}"><b>${c.no}번 ${fmt(c.at)} 도착 <small>(${c.m===0?"도착":`${c.m}분`})</small></b></div>`;
  if(ok&&ok.m-WALK>=3) go=box("green","여유 있어",ok);
  else if(ok) go=box("amber","지금 나가!",ok);
  else if(hurry) go=box("red","뛰어!",hurry);
  else if(cands.length) go=`<div class="go red"><em>이번 버스는 어려워</em><b>다음 버스를 기다려</b></div>`;
  else go=`<div class="go gray"><em>대기</em><b>아직 가까이 오는 버스 없음</b></div>`;
  $("busGo").innerHTML=go;
  $("busGrid").innerHTML=cards.join("");placeBuses();
}
// 시간 제한 있는 fetch (AbortSignal 없이 — 일부 미리보기 환경에서 signal을 넘기면 오류)
// 매번 주소 끝에 시각을 붙여 휴대폰·통신사 캐시가 옛 응답을 돌려주지 못하게 함
function fresh(u,f){return u+(u.includes("?")?"&":"?")+(f?"f=1&":"")+"_="+Date.now();}
function fetchT(url,ms){return Promise.race([fetch(url,{cache:"no-store"}),new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error("응답이 늦어"),{name:"Timeout"})),ms))]);}
// 마지막 결과를 휴대폰에 저장해 두고, 열자마자 먼저 보여줌 (3분 이내 것만)
try{const c=JSON.parse(localStorage.getItem("liveCache")||"null");if(c&&Date.now()-c.at<18e4){LIVE=c.data;liveAt=c.at;}}catch(_){}
var LIVE_FORCE=false;
// 새 응답을 믿을지 판단: 오류가 섞였거나, 방금까지 오던 버스가 갑자기 전부 사라지면 '일시 오류'로 보고
// 직전 정보(3분 이내)를 유지한 채 잠시 후 한 번 더 받아옴
function hasBus(j){return !!j&&(j.routes||[]).some(r=>(r.buses||[]).length||r.next);}
function judge(j,prev,prevAt,miss){
  const fresh3=prev&&Date.now()-prevAt<18e4;
  if(j.error&&fresh3)return "keep";
  if(!hasBus(j)&&fresh3&&hasBus(prev)&&miss<2){
    const soon=(prev.routes||[]).some(r=>(r.buses||[]).concat(r.next?[r.next]:[]).some(b=>busMin(b,prev.time)>=1));
    if(soon)return "keep";
  }
  return "use";
}
var liveMiss=0, LIVE_STALE=false;
async function loadLive(){
  const url=DATA.bus&&DATA.bus.live; if(!url)return;
  try{const r=await fetchT(fresh(url,LIVE_FORCE),8000);LIVE_FORCE=false;const j=await r.json();
    if(j.error&&!(j.routes||[]).length){LIVE_ERR=j.error;}
    else if(judge(j,LIVE,liveAt,liveMiss)==="keep"){liveMiss++;LIVE_STALE=true;if(liveMiss<=2)setTimeout(()=>{LIVE_FORCE=true;loadLive().then(liveStamp);},4000);}
    else{anchor(j,"am");LIVE=j;LIVE_ERR="";LIVE_STALE=false;liveMiss=0;liveAt=Date.now();
      try{localStorage.setItem("liveCache",JSON.stringify({at:liveAt,data:j}));}catch(_){}}}
  catch(e){LIVE_ERR=e&&e.message?e.message:"접속 실패";if(LIVE&&Date.now()-liveAt<18e4)LIVE_STALE=true;}
  drawLive();
}
function hms(d){return `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;}
function liveStamp(){const d=new Date(LIVE&&LIVE.time?Date.parse(LIVE.time):liveAt);$("busRefreshTxt").innerHTML=liveAt?`새로고침 <small>${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")} 기준${LIVE_STALE?" · 연결 다시 시도 중":""}</small>`:"새로고침";}
let liveBusy=false;
let livePend=false;
async function refreshLive(){if(liveBusy){livePend=true;return;}liveBusy=true;const btn=$("busRefresh");btn.classList.add("spin");$("busRefreshTxt").firstChild&&($("busRefreshTxt").innerHTML="받아오는 중…");
  await loadLive();btn.classList.remove("spin");liveStamp();liveBusy=false;
  if(livePend){livePend=false;LIVE_FORCE=true;refreshLive();}}
$("busRefresh").onclick=()=>{LIVE_FORCE=true;refreshLive();};
// 등교 시간(수업 있는 날 06:30~08:30)에만 버스 정보를 보여주고 불러옴
var BUS_FROM=6*60+30, BUS_TO=8*60+30;
function busWindow(){
  const d=new Date(), k=ymd(d), m=d.getHours()*60+d.getMinutes(), day=DATA.days[k];
  const school=!!(day&&day.tt.length&&!isExamDay(k));
  return {on:school&&m>=BUS_FROM&&m<=BUS_TO, school, k};
}
// 등교·하교 탭 (오전엔 등교, 낮 12시부터는 하교가 기본. 직접 바꿀 수 있음)
let BUS_TAB=new Date().getHours()<12?"am":"pm";
function setTab(t,force){BUS_TAB=t;
  ["am","pm"].forEach(x=>{const b=$(x==="am"?"tabAm":"tabPm");b.classList.toggle("on",x===t);b.setAttribute("aria-selected",x===t);});
  $("sec-bus").classList.toggle("tab-pm",t==="pm");
  $("busPm").hidden=t!=="pm";
  if(t==="pm"){drawPm();pmSpin();loadPm(force);}else if(busGate()){if(LIVE)drawLive();LIVE_FORCE=!!force;refreshLive();}
}
// 하교 버스 (학교 → 학원)
var LIVE_PM=null, LIVE_PM_ERR="", livePmAt=0, pmMiss=0, PM_STALE=false;
const WALK_PM=3; // 학교 → 가락마을12,14단지 정류장 걷는 시간(분) [가정]
async function loadPm(force){
  const h=DATA.busPm, url=DATA.bus&&DATA.bus.live; if(!h||!url)return;
  try{const r=await fetchT(fresh(url+(url.includes("?")?"&":"?")+"t=pm",force),8000);const j=await r.json();
    // 예전 Apps Script는 하교(t=pm)를 몰라서 등교 데이터(221번 포함)를 돌려줌 → 잘못된 정류장으로 보이므로 막음
    if((j.routes||[]).some(r=>!h.routes.includes(r.no))){LIVE_PM=null;LIVE_PM_ERR="Apps Script가 예전 버전이에요 (배포 관리 → 연필 → 새 버전으로 배포)";}
    else if(j.error&&!(j.routes||[]).length)LIVE_PM_ERR=j.error;
    else if(judge(j,LIVE_PM,livePmAt,pmMiss)==="keep"){pmMiss++;PM_STALE=true;if(pmMiss<=2)setTimeout(()=>loadPm(true),4000);}
    else{anchor(j,"pm");LIVE_PM=j;LIVE_PM_ERR="";PM_STALE=false;pmMiss=0;livePmAt=Date.now();}}
  catch(e){LIVE_PM_ERR=e&&e.message?e.message:"접속 실패";if(LIVE_PM&&Date.now()-livePmAt<18e4)PM_STALE=true;}
  drawPm();
}
function drawPm(){

  if(!LIVE_PM){el.innerHTML=head+`<div class="bus-go"><div class="go gray"><em>${LIVE_PM_ERR?"연결 안 됨":"대기"}</em><b>${LIVE_PM_ERR?"실시간 연결 안 됨":"불러오는 중…"}</b><span class="now">${esc(LIVE_PM_ERR||"")}</span></div></div>`+btn;bindPm();return;}
  const MAXS=8, NEAR=5, cands=[], cards=[];

    cards.push(`<div class="bc ${lv} wide"><div class="bc-h"><span class="bus-no">${esc(no)}</span><span class="bc-at">${fmt(at)} 정류장 도착</span></div>
      <div class="bc-m">${m===0?"도착":`${m}<small>분</small>`}</div>
      ${near.left<=NEAR?trackHTML(bs,NEAR,LIVE_PM.time,LIVE_PM.perStop,LAG_PM,"pm|"+no):`<div class="bar"><i style="width:${pct}%"></i></div>`}
      <div class="bc-s">${near.left===0?"정류장에 있음":`${near.left}정거장 전`}<span>${near.far?esc(near.at||""):esc((h.lines[no]||[])[MAXS-near.left]||near.at)}</span>${near.turn?`<em class="turn">회차 전 · 늦을 수 있음</em>`:""}</div>
      <div class="dests"><small>학원 근처 도착 예상</small>${arr}</div></div>`);
  });
  cands.sort((a,b)=>a.m-b.m);
  const ok=cands.find(c=>c.m>=WALK_PM), hurry=cands.find(c=>c.m>=WALK_PM-1);
  const box=(cls,tag,c)=>`<div class="go ${cls}"><b>${c.no}번 ${fmt(c.at)} 도착 <small>(${c.m===0?"도착":`${c.m}분`})</small></b></div>`;
  let go;
  if(ok&&ok.m-WALK_PM>=3)go=box("green","여유 있어",ok);
  else if(ok)go=box("amber","지금 나가!",ok);
  else if(hurry)go=box("red","뛰어!",hurry);
  else if(cands.length)go=`<div class="go red"><em>이번 버스는 어려워</em><b>다음 버스를 기다려</b></div>`;

  el.innerHTML=head+`<div class="bus-go">${go}</div>`+`<div class="bus-grid one">${cards.join("")}</div>`+btn;bindPm();placeBuses();
}
function pmSpin(){const b=$("pmRefresh");if(b){b.classList.add("spin");b.querySelector("span").textContent="받아오는 중…";}}
function bindPm(){const b=$("pmRefresh");if(b)b.onclick=()=>{pmSpin();loadPm(true);};}

function busGate(){

// 수행 체크 (내 폰에만 저장) — 마감 보드 + 단계 진행
(function(){
  let done={},steps={};
  try{done=JSON.parse(localStorage.getItem("paDone")||"{}");steps=JSON.parse(localStorage.getItem("paSteps")||"{}");}catch(_){}
  const save=()=>{try{localStorage.setItem("paDone",JSON.stringify(done));localStorage.setItem("paSteps",JSON.stringify(steps));}catch(_){}};
  const id=x=>weekStart+"|"+x[0]+"|"+x[1];
  const STEPS=["준비","작성","점검","제출"];
  const TIPS={"검산 필수":"직접 풀어서 답이 하나인지 확인","양쪽 근거":"찬반 근거 모두, 결론은 과학으로","사례 + 통계":"실제 사례 1개 + 통계로 뒷받침",
    "실행 확인 · 주석":"제출 전 실행, 주석 달기","출석 2/3":"출석 2/3 이상이면 통과","과정 사진":"완성작 + 제작 과정 사진","원인 → 해결책":"원인을 나누고 해결책까지",
    "손목 힘 빼기":"네트 바로 너머로 떨어뜨리기","음악 요소로 근거":"느낌 말고 음악 요소로 근거","이모티콘 먼저":"이모티콘은 11월 마감, 먼저 끝내기",
    "마감 주간":"풀이 과정 최종 점검","출처 표시":"출처 표시까지 마지막 점검","활동 기록":"캠페인 사진·기록 남기기","시험 전 진도":"시험 전에 진도 최대한","완성작 사진":"시험 후 마무리, 완성작 사진"};
  const IC={cal:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
    pie:'<svg viewBox="0 0 24 24"><path d="M12 3v9h9A9 9 0 1 1 12 3z"/></svg>',clk:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'};
  // 'N월 M주' → 그 주 금요일 (그 달 첫 평일이 든 주 = 1주)
  const firstMon=(y,m)=>{let f=new Date(y,m-1,1);while(f.getDay()===0||f.getDay()===6)f.setDate(f.getDate()+1);const r=new Date(f);r.setDate(f.getDate()-((f.getDay()+6)%7));return r;};
  const yr=toD(weekStart).getFullYear();
  const fri=(m,w)=>{const y=m<toD(weekStart).getMonth()+1-6?yr+1:yr;const d=firstMon(y,m);d.setDate(d.getDate()+(w-1)*7+4);return d;};
  const lastWd=m=>{const y=m<toD(weekStart).getMonth()+1-6?yr+1:yr;let l=new Date(y,m,0);while(l.getDay()===0||l.getDay()===6)l.setDate(l.getDate()-1);return l;};
  const deadline=x=>{const a=[...x[1].matchAll(/(\d+)월\s*(\d+)(?:~(\d+))?\s*주/g)];
    if(a.length){const g=a[a.length-1];return fri(+g[1],+(g[3]||g[2]));}
    const mo=[...x[1].matchAll(/~\s*(\d+)월/g)];return mo.length?lastWd(+mo[mo.length-1][1]):null;};
  const ws=toD(weekStart), we=new Date(ws);we.setDate(ws.getDate()+4);
  function ring(dn,tot){const r=15,c=2*Math.PI*r,p=tot?dn/tot:0;
    return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" fill="none" stroke="#eceaf8" stroke-width="5"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="#7048e8" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 20 20)"/></svg><b>${dn}/${tot}</b><span>${dn===tot&&tot?"다 했다!":"완료"}</span>`;}
  const open=new Set(); let firstOpen=true;
  function item(o){
    const {x,i,dl,dd}=o, k=id(x), st=steps[k]||[], cnt=STEPS.filter((_,n)=>st[n]).length, isDone=!!done[k], dt=x[5]||{};
    const pct=isDone?100:Math.round(cnt/STEPS.length*100);
    const ddTxt=dl?(dd>0?`D-${dd}`:(dd===0?"D-day":"마감 지남")):"";
    const title=x[1].replace(/\s*[·(].*$/,"");
    return `<div class="pi ${isDone?"done":""}${open.has(k)?" open":""}" style="--h:${hue(x[0])}" data-k="${esc(k)}">
      <div class="pi-row">
        <input type="checkbox" class="chk" data-a="done" data-i="${i}" ${isDone?"checked":""} aria-label="${esc(x[0])} 완료">
        <button type="button" class="pi-main" data-a="tog" data-i="${i}" aria-expanded="${open.has(k)}">
          <span class="pi-sub">${esc(x[0])}</span><span class="pi-tt">${esc(title)}</span>
        </button>
        <span class="pi-r" data-a="tog" data-i="${i}">${ddTxt?`<em class="${dd<=3?"hot":""}">${ddTxt}</em>`:""}<small>${esc(x[4]||"")}</small></span>
      </div>
      <div class="pi-prog"><i style="width:${pct}%"></i></div>
      <button type="button" class="pi-tog" data-a="tog" data-i="${i}" aria-expanded="${open.has(k)}"><span>${open.has(k)?"접기":`단계 체크 · 팁 보기${cnt&&!isDone?` (${cnt}/4)`:""}`}</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="pi-more">
        <div class="steps">${STEPS.map((nm,n)=>`<button type="button" class="stp${(st[n]||isDone)?" on":""}" data-a="step" data-i="${i}" data-n="${n}"><b>${(st[n]||isDone)?"✓":n+1}</b>${nm}</button>`).join('<span class="sl"></span>')}</div>
        <div class="pm-chips">
          ${dl?`<span class="cp ${dd<=3?"hot":""}">${IC.cal}${dl.getMonth()+1}.${dl.getDate()}.(금) 무렵</span>`:""}
          ${x[4]?`<span class="cp">${IC.pie}${esc(x[4])}</span>`:""}
          <span class="cp">${IC.clk}${esc((x[1].match(/\d+월[^·]*$/)||x[1].match(/~?\d+월[^)]*/)||[""])[0].replace(/[()]/g,"").trim())}</span>
        </div>
        <dl class="pm">
          <dt>${x[0]==="생태와 환경"?"통과":"A 포인트"}</dt><dd><b class="kw">${esc(x[3]||"")}</b>${esc(dt.as||dt.a||"")}<span class="sub">${esc(dt.ts||TIPS[x[3]]||x[2]||"").replace(/^예:/,"<b>예:</b>")}</span></dd>
          <dt>체크</dt><dd class="cl">${(dt.cs||dt.chk||[]).map((c,n)=>`<button type="button" class="ci${(steps[k+"|c"]||[])[n]?" on":""}" data-a="ck" data-i="${i}" data-n="${n}"><i></i>${esc(c)}</button>`).join("")}</dd>
        </dl>
      </div>
    </div>`;
  }
  function draw(){
    if(!paList.length){$("pa").innerHTML='<div class="nomeal">이번 주는 수행평가 없어. 시험 공부 집중!</div>';$("paRing").innerHTML="";return;}
    const all=paList.map((x,i)=>{const dl=deadline(x);const dd=dl?Math.round((dl-today0)/864e5):null;
      return {x,i,dl,dd,due:dl&&dl>=ws&&dl<=we,done:!!done[id(x)]};});
    const dn=all.filter(o=>o.done).length;
    $("paRing").innerHTML=ring(dn,all.length);
    const by=f=>all.filter(f).sort((a,b)=>(a.dl||9e15)-(b.dl||9e15));
    const G=[["hot","이번 주 마감",by(o=>!o.done&&o.due)],["ing","진행 중",by(o=>!o.done&&!o.due)],["fin","완료",by(o=>o.done)]];
    if(firstOpen){firstOpen=false;const f=(G[0][2][0]||G[1][2][0]);if(f)open.add(id(f.x));}
    $("pa").innerHTML=G.filter(g=>g[2].length).map(([c,t,l])=>`<div class="pg ${c}"><h3><i></i>${t}<span>${l.length}</span></h3>${l.map(item).join("")}</div>`).join("");
  }
  $("pa").addEventListener("click",e=>{
    const b=e.target.closest("[data-a]");if(!b)return;const x=paList[+b.dataset.i];if(!x)return;const k=id(x);
    if(b.dataset.a==="tog"){open.has(k)?open.delete(k):open.add(k);draw();return;}
    if(b.dataset.a==="ck"){const ck=steps[k+"|c"]||[];ck[+b.dataset.n]=!ck[+b.dataset.n];steps[k+"|c"]=ck;save();draw();return;}
    if(b.dataset.a==="step"){const st=steps[k]||[false,false,false,false];const n=+b.dataset.n;st[n]=!st[n];steps[k]=st;
      if(st.every(Boolean))done[k]=true;else if(done[k])done[k]=false;save();draw();return;}
  });
  $("pa").addEventListener("change",e=>{
    const b=e.target;if(b.dataset.a!=="done")return;const x=paList[+b.dataset.i];if(!x)return;const k=id(x);
    done[k]=b.checked;if(b.checked)steps[k]=[true,true,true,true];save();draw();
  });
  draw();
})();

// 기말고사 플래너 (쉬운 버전): 오늘 할 것 2~3개 + 과목별 단원 동그라미 한 번씩 누르기
// - 단원 상태: ○ 아직 → ◐ 1단계(개념) → ● 2단계(문제까지)
// - 체크는 이 휴대폰에 저장되고, 화면 뒤에서 Apps Script에도 저장 (부모님 보기용)
(function(){
  const EX=DATA.exam, sec=$("sec-exam"), box=$("exam");
  if(!EX||!sec||!box)return;
  const dDiff=(a,b)=>Math.round((a-b)/864e5);
  const F=toD(EX.from), T=toD(EX.to);
  if(dDiff(F,today0)>28||dDiff(T,today0)<0){sec.hidden=true;return;}
  sec.hidden=false;if($("tabExam"))$("tabExam").hidden=false;  // 아래 바로가기에도 '기말' 표시
  const URL_=DATA.bus&&DATA.bus.live, SID=EX.from+"-v"+(EX.ver||1);
  const dayLbl=k=>`${md(k)}(${WD[toD(k).getDay()]})`;
  const hm=d=>`${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
  const dot=l=>`<i class="dt l${l||0}"></i>`;  // ○ ◐ ● 를 그림으로 (글꼴마다 모양이 달라서)

  // 부모님 보기
  const q=new URLSearchParams(location.search);
  if(q.get("parent")){try{localStorage.setItem("parentKey",q.get("parent"));}catch(_){}history.replaceState(null,"",location.pathname);}
  let PK=null;try{PK=localStorage.getItem("parentKey");}catch(_){}
  const RO=!!PK;

  // 상태: {id, u:{과목:[{n,l}]}, day:{k, picks:[{s,n,l,done}]}, ts, sent}
  const fresh=()=>({id:SID,u:{},day:null,ts:0,sent:0});
  let st=null;
  if(!RO){try{st=JSON.parse(localStorage.getItem("examPlan")||"null");}catch(_){}}
  if(!st||st.id!==SID)st=fresh();
  let remote={state:RO?"loading":"",saved:null,err:""};
  // 기본 범위(진도표)가 바뀌면 이미 체크한 단원은 이름으로 찾아 그대로 두고 새 단원만 끼워 넣음
  const units=s=>{
    if(!st.u[s.s]){const v=s.u.map(n=>({n,l:0}));if(RO)return v;st.u[s.s]=v;st.base=st.base||{};st.base[s.s]=s.u.slice();return v;}
    if(!RO){st.base=st.base||{};const base=st.base[s.s]||st.u[s.s].map(u=>u.n);
      if(base.join("\n")!==s.u.join("\n")){const old=st.u[s.s],custom=old.filter(u=>!base.includes(u.n)&&!s.u.includes(u.n));
        st.u[s.s]=s.u.map(n=>{const o=old.find(u=>u.n===n);return{n,l:o?o.l:0};}).concat(custom);st.base[s.s]=s.u.slice();}
      else if(!st.base[s.s])st.base[s.s]=s.u.slice();}
    return st.u[s.s];};
  const stat=s=>{const us=units(s),tot=us.length*2,dn=us.reduce((a,u)=>a+(u.l||0),0);return{tot,dn,p:tot?Math.round(dn/tot*100):0};};
  const verb=(s,l)=>(s.st||["개념","문제"])[l];

  // 오늘 할 것: 비중 × 남은 분량 ÷ 남은 날 이 큰 과목부터, 과목마다 아직 안 끝난 첫 단원
  const MAIN=["공통국어2","공통영어2","공통수학2","통합과학2"];  // 오늘 할 것은 국·영·수·과 위주
  function pickNext(skip){
    const left=Math.max(1,dDiff(F,today0));
    const pool=EX.subj.filter(s=>MAIN.includes(s.s)&&stat(s).dn<stat(s).tot);  // 국영수과가 다 끝나면 나머지 과목
    const c=(pool.length?pool:EX.subj).map(s=>{const k=stat(s);if(skip.has(s.s)||k.dn>=k.tot)return null;
      const u=units(s).find(u=>(u.l||0)<2);return{s,u,score:s.w*(1-k.dn/k.tot)/left};}).filter(Boolean).sort((a,b)=>b.score-a.score)[0];
    return c?{s:c.s.s,n:c.u.n,l:c.u.l||0,done:false}:null;
  }
  function todayPicks(){
    if(RO)return (st.day&&st.day.k===todayK)?st.day.picks:[];
    if(!st.day||st.day.k!==todayK||st.day.r!==2){  // r: 고르는 규칙이 바뀌면 오늘 것도 다시 (이미 한 것은 남김)
      const kept=(st.day&&st.day.k===todayK)?st.day.picks.filter(p=>p.done):[];
      const N=dDiff(F,today0)<=7?3:2, skip=new Set(kept.map(p=>p.s)), picks=kept.slice();
      while(picks.length<Math.max(N,kept.length)){const p=pickNext(skip);if(!p)break;skip.add(p.s);picks.push(p);}
      st.day={k:todayK,r:2,picks};save(true);
    }
    return st.day.picks;
  }
  const open=new Set(), editing=new Set();

  function draw(){
    const dd=dDiff(F,today0);
    $("exDd").textContent=dd>0?`D-${dd}`:"시험 중";
    let tot=0,dn=0;EX.subj.forEach(s=>{const k=stat(s);tot+=k.tot;dn+=k.dn;});
    $("exAll").innerHTML=`<small>준비</small>${tot?Math.round(dn/tot*100):0}%`;
    let h=`<p class="ex-top">${dayLbl(EX.from)} ~ ${dayLbl(EX.to)} · ${esc(EX.n)}${RO?" · 아들 현황(보기 전용)":""}</p>`;
    if(RO&&remote.state!=="ok")h+=`<div class="ex-msg">${remote.state==="loading"?"불러오는 중…":esc(remote.err||"아직 공유된 내용이 없어요")}</div>`;

    // 오늘 할 것
    const picks=todayPicks(), all=picks.length&&picks.every(p=>p.done);
    let t=picks.map((p,i)=>{const s=EX.subj.find(x=>x.s===p.s);if(!s)return"";
      return `<div class="ex-task${p.done?" done":""}" style="--h:${hue(s.s)}"><span class="ex-tx"><b>${esc(s.n)}</b> ${esc(p.n)} <em>${esc(verb(s,p.l))}</em></span>${RO?(p.done?`<span class="ex-ok">했어</span>`:""):`<button type="button" class="ex-did" data-a="did" data-i="${i}" aria-pressed="${p.done}">${p.done?"✓ 했어":"했어"}</button>`}</div>`;}).join("");
    if(!picks.length)t=`<div class="ex-msg">${tot&&dn>=tot?"범위를 다 끝냈어요. 틀렸던 문제만 한 번 더!":"오늘 할 것이 없어요"}</div>`;
    else if(all&&!RO)t+=`<div class="ex-fin">오늘 목표 끝! <button type="button" class="ex-btn" data-a="more">하나 더</button></div>`;
    h+=`<div class="ex-today"><h3>오늘 할 것</h3>${t}</div>`;

    // 과목: 한 줄씩, 누르면 단원 동그라미
    h+=EX.subj.map(s=>{const k=stat(s),op=open.has(s.s),ed=editing.has(s.s);
      let more="";
      if(op){
        more=`<p class="exs-tip">${esc(s.tip||"")}</p><p class="exs-leg">한 번 누르면 ${dot(1)} ${esc(verb(s,0))} · 두 번 누르면 ${dot(2)} ${esc(verb(s,1))}까지</p>`;
        if(ed){
          more+=`<textarea data-ta="${esc(s.s)}" aria-label="${esc(s.n)} 시험 범위, 한 줄에 단원 하나">${esc(units(s).map(u=>u.n).join("\n"))}</textarea>
            <div class="ed-row"><button type="button" class="ex-btn" data-a="cancel" data-s="${esc(s.s)}">취소</button><button type="button" class="ex-btn pri" data-a="saveU" data-s="${esc(s.s)}">저장</button></div>`;
        }else{
          more+=units(s).map((u,ui)=>`<button type="button" class="exu2 l${u.l||0}" data-a="cyc" data-s="${esc(s.s)}" data-u="${ui}" ${RO?"disabled":""}>${dot(u.l)}<span>${esc(u.n)}</span></button>`).join("");
          if(!RO)more+=`<div class="exs-tools"><span>범위는 진도표로 채운 예상이에요</span><button type="button" class="ex-btn" data-a="edit" data-s="${esc(s.s)}">범위 고치기</button></div>`;
        }
      }
      return `<div class="exs${op?" open":""}" style="--h:${hue(s.s)}">
        <button type="button" class="exs-h" data-a="open" data-s="${esc(s.s)}" aria-expanded="${op}"><span class="exs-n">${esc(s.n)}</span><span class="exs-dots">${units(s).map(u=>dot(u.l)).join("")}</span><span class="exs-p">${k.p}%</span></button>
        ${op?`<div class="exs-more">${more}</div>`:""}</div>`;}).join("");
    if(RO)h+=`<div class="ex-share"><span>${remote.saved?`아들 휴대폰 <b>${md(ymd(new Date(remote.saved)))} ${hm(new Date(remote.saved))}</b> 저장`:"보기 전용"}</span><span><button type="button" class="ex-btn" data-a="pull">새로고침</button><button type="button" class="ex-btn" data-a="unpar">부모 보기 끄기</button></span></div>`;
    box.classList.toggle("ro",RO);
    box.innerHTML=h;
  }

  // 저장 + 화면 뒤 공유
  let tmr=null;
  function save(quiet){st.ts=Date.now();try{localStorage.setItem("examPlan",JSON.stringify(st));}catch(_){}if(!quiet||st.ts>(st.sent||0)){clearTimeout(tmr);tmr=setTimeout(push,2500);}}
  function post(body){return Promise.race([fetch(URL_,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}),new Promise((_,r)=>setTimeout(()=>r(new Error("응답이 늦어")),15000))]).then(r=>r.json());}
  async function push(){
    if(!URL_||RO)return;
    try{const j=await post({kind:"plan",data:st});if(j.ok){st.sent=st.ts;try{localStorage.setItem("examPlan",JSON.stringify(st));}catch(_){}}}catch(_){}
  }
  async function pull(){
    remote.state="loading";draw();
    try{const r=await fetchT(`${URL_}${URL_.includes("?")?"&":"?"}t=plan&k=${encodeURIComponent(PK)}&_=${Date.now()}`,12000);const j=await r.json();
      if(!j.ok)remote={state:"err",saved:null,err:j.error||"불러오기 실패"};
      else if(!j.data||j.data.id!==SID)remote={state:"err",saved:null,err:"아직 공유된 내용이 없어요 (아들 휴대폰에서 아직 체크 전)"};
      else{st=Object.assign(fresh(),j.data);remote={state:"ok",saved:j.saved,err:""};}}
    catch(e){remote={state:"err",saved:null,err:"연결 실패 — 잠시 후 새로고침"};}
    draw();
  }

  box.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;const a=b.dataset.a, s=EX.subj.find(x=>x.s===b.dataset.s);
    if(a==="open"){open.has(s.s)?open.delete(s.s):open.add(s.s);editing.delete(s.s);draw();return;}
    if(RO){if(a==="pull")pull();else if(a==="unpar"){try{localStorage.removeItem("parentKey");}catch(_){}location.replace(location.pathname);}return;}
    if(a==="did"){ // 오늘 할 것: 했어 ↔ 취소 (그 단원 단계도 같이 올리고 내림)
      const p=st.day.picks[+b.dataset.i], sj=EX.subj.find(x=>x.s===p.s), u=sj&&units(sj).find(u=>u.n===p.n);
      p.done=!p.done;if(u)u.l=p.done?Math.max(u.l||0,p.l+1):Math.min(u.l||0,p.l);save();draw();
    }else if(a==="more"){const p=pickNext(new Set(st.day.picks.filter(p=>!p.done).map(p=>p.s)));if(p){st.day.picks.push(p);save();}draw();}
    else if(a==="cyc"){const u=units(s)[+b.dataset.u];u.l=((u.l||0)+1)%3;save();draw();}
    else if(a==="edit"){editing.add(s.s);draw();}
    else if(a==="cancel"){editing.delete(s.s);draw();}
    else if(a==="saveU"){
      const ta=box.querySelector(`textarea[data-ta="${CSS.escape(s.s)}"]`);
      const old=units(s), names=ta.value.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,15);
      st.u[s.s]=names.map(n=>{const o=old.find(u=>u.n===n);return{n:n.slice(0,60),l:o?o.l:0};});
      editing.delete(s.s);save();draw();
    }
  });

  const pkIn=$("pkIn"), pkSave=$("pkSave");
  if(pkSave)pkSave.onclick=()=>{const v=(pkIn.value||"").trim();try{v?localStorage.setItem("parentKey",v):localStorage.removeItem("parentKey");}catch(_){}location.replace(location.pathname);};
  if(pkIn&&PK)pkIn.placeholder="부모 보기 켜짐 · 지우고 저장하면 꺼짐";
  draw();
  if(RO)pull();
  else if(st.ts>(st.sent||0))push();
})();

// 화면 편집 (순서·숨김, 이 기기에만 저장)
(function(){
  const SECS=[["sec-today","오늘","#2f6bff"],["sec-ev","다가오는 일정","#f04452"],["sec-tt","이번 주 시간표","#2f6bff"],
    ["sec-bus","버스","#2fb344"],["sec-meal","급식","#f76707"],["sec-exam","기말고사","#f04452"],["sec-pa","수행 체크","#7048e8"]];
  const DEF=SECS.map(x=>x[0]);
  let st={order:DEF.slice(),hidden:[]};
  try{const v=JSON.parse(localStorage.getItem("layout")||"null");if(v&&Array.isArray(v.order)){st.order=v.order.filter(id=>DEF.includes(id));if(v.v!==2){st.order=st.order.filter(id=>id!=="sec-exam");const i=st.order.indexOf("sec-pa");st.order.splice(i<0?st.order.length:i,0,"sec-exam");}DEF.forEach(id=>{if(!st.order.includes(id))st.order.push(id);});st.hidden=(v.hidden||[]).filter(id=>DEF.includes(id));}}catch(_){}
  const wrap=document.querySelector(".wrap"), btn=$("editBtn");
  function apply(){
    st.order.forEach(id=>{const el=$(id);if(el)wrap.insertBefore(el,btn);});
    DEF.forEach(id=>$(id)&&$(id).classList.toggle("user-hidden",st.hidden.includes(id)));
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("user-hidden",st.hidden.includes(t.dataset.go)));
  }
  function save(){try{localStorage.setItem("layout",JSON.stringify(Object.assign({v:2},st)));}catch(_){}}
  const up='<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>', dn='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
  const eye='<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeOff='<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6"/></svg>';
  function draw(){
    $("edList").innerHTML=st.order.map((id,i)=>{const [,nm,c]=SECS.find(x=>x[0]===id);const off=st.hidden.includes(id);
      return `<li class="${off?"off":""}"><span class="nm"><i style="--c:${c}"></i>${nm}</span>
        <button type="button" data-a="up" data-i="${i}" aria-label="${nm} 위로" ${i===0?"disabled":""}>${up}</button>
        <button type="button" data-a="dn" data-i="${i}" aria-label="${nm} 아래로" ${i===st.order.length-1?"disabled":""}>${dn}</button>
        <button type="button" class="eye" data-a="eye" data-i="${i}" aria-label="${nm} ${off?"보이기":"숨기기"}">${off?eyeOff:eye}</button></li>`;}).join("");
  }
  $("edList").addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i,id=st.order[i];
    if(b.dataset.a==="up"&&i>0)[st.order[i-1],st.order[i]]=[st.order[i],st.order[i-1]];
    if(b.dataset.a==="dn"&&i<st.order.length-1)[st.order[i+1],st.order[i]]=[st.order[i],st.order[i+1]];
    if(b.dataset.a==="eye")st.hidden=st.hidden.includes(id)?st.hidden.filter(x=>x!==id):[...st.hidden,id];
    save();apply();draw();
  });
  btn.onclick=()=>{draw();$("sheetBg").hidden=false;};
  const close=()=>{$("sheetBg").hidden=true;};
  $("edDone").onclick=close;
  $("sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg")close();});
  $("edReset").onclick=()=>{st={order:DEF.slice(),hidden:[]};save();apply();draw();};
  apply();
})();

// 탭바
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{$(b.dataset.go).scrollIntoView({block:"start"});});
const secs=["sec-today","sec-tt","sec-meal","sec-exam","sec-pa"].map($);
if("IntersectionObserver" in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.go===e.target.id));}}),{rootMargin:"-40% 0px -55% 0px"});
  secs.forEach(s=>io.observe(s));
}
</script>
</body>
