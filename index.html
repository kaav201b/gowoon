<style>
/* layout: 폰 앱처럼 한 열 카드 + 하단 탭바, 과목마다 고유 색 */
:root{
  --bg:#eef1ef; --surface:#ffffff; --ink:#18201d; --muted:#66706b; --line:#e2e7e4;
  --accent:#0e8f7e; --accent-soft:#dff3ef; --hot:#ec5b38; --hot-soft:#fde9e3;
  --cellS:62%; --cellL:92%; --cellInk:#1c2420;
  --shadow:0 1px 2px rgba(20,40,32,.06),0 6px 20px rgba(20,40,32,.06);
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:only light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
body{padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0))}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
h1,h2,.num{font-family:var(--display);font-weight:400;letter-spacing:.01em}
h2{font-size:20px;margin:0;text-wrap:balance}

/* 상단 */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 2px 2px}
.top h1{font-size:24px;margin:0;line-height:1.2}
.wk{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 오늘 카드 */
.hero{background:var(--accent);color:#fff;border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hero .hi{font-family:var(--display);font-size:24px;line-height:1.25;text-wrap:balance}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 10px 8px}
.stat .num{font-size:24px;line-height:1}
.stat span{display:block;font-size:12px;opacity:.9;margin-top:4px}
.hero .lunch{font-size:13px;background:rgba(0,0,0,.12);border-radius:12px;padding:8px 12px}
.hero .lunch b{font-weight:700}

/* 공통 카드 */
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);scroll-margin-top:12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h span{font-size:12px;color:var(--muted)}

/* 일정 */
.ev{display:flex;flex-direction:column;gap:10px}
.ev-row{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start}
.dd{border-radius:14px;background:var(--accent-soft);color:var(--accent);text-align:center;padding:8px 0 6px}
.dd .num{font-size:22px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.dd small{font-size:11px}
.dd.soon{background:var(--hot-soft);color:var(--hot)}
.ev-row b{display:block;font-size:15px}
.ev-row p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* 시간표 */
.tt{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;margin:-4px}
.tt th{font-size:12px;font-weight:500;color:var(--muted);padding:2px 0 4px}
.tt th.pc{width:18px}
.tt th.today{color:var(--accent);font-weight:700}
.tt th.today .num{background:var(--accent);color:#fff;border-radius:8px;padding:0 6px}
.tt th .num{font-size:16px;color:var(--ink);display:inline-block}
.tt td{height:46px;border-radius:10px;font-size:12px;line-height:1.25;text-align:center;padding:4px 2px;word-break:keep-all;position:relative;
  background:hsl(var(--h) var(--cellS) var(--cellL));color:var(--cellInk)}
.tt td.empty{background:transparent;border:1px dashed var(--line)}
.tt td.off{background:var(--bg);color:var(--muted)}
.tt td.pa::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 2px var(--surface)}
.tt .pnum{font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--hot)}

/* 급식 */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mday{flex:0 0 31%;min-width:108px;max-width:140px;scroll-snap-align:start;border-radius:14px;padding:10px;border:1px solid var(--line)}
.mday.today{border-color:var(--accent);background:var(--accent-soft)}
.mday h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:17px;display:flex;align-items:baseline;gap:4px}
.mday h3 small{font-family:var(--body);font-size:11px;color:var(--muted)}
.meal+.meal{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.mh b{font-size:12px;color:var(--accent)}
.mh span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal ul{margin:0;padding:0;list-style:none}
.meal li{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.meal li:first-child{font-weight:700}
.nomeal{font-size:13px;color:var(--muted)}

/* 수행 */
.pa-list{display:flex;flex-direction:column;gap:10px}
.pa-item{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px;border-radius:16px;border:1px solid var(--line)}
.pa-item.done{opacity:.55}
.pa-item.done .subj,.pa-item.done .pa-name{text-decoration:line-through}
.chk{appearance:none;width:24px;height:24px;margin:2px 0 0;border-radius:8px;border:2px solid var(--line);cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pa-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.subj{display:inline-block;font-size:15px;font-weight:700;line-height:1.3;padding:3px 10px;border-radius:8px;background:hsl(var(--h) var(--cellS) var(--cellL));color:var(--cellInk)}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pa-name{font-size:14px;color:var(--muted);margin:0 0 8px}
.tip{font-size:13px;line-height:1.5;background:var(--hot-soft);color:var(--ink);border-radius:10px;padding:8px 10px}
.tip b{display:inline-block;color:var(--hot);font-weight:700;margin-right:6px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:4px 8px 8px;line-height:1.6}

/* 하단 탭바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0))}
.tabbar nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;font:500 11px var(--body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;border-radius:10px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

    "이모티콘은 이번 달이 마감이니 먼저 끝내기",
    "이모티콘 먼저",
    "실습 · 30%+35%"
   ]
  ],
  "20261130": [
   [
    "공통수학2",
    "문제 만들기 · ~12월 1주 마감",
    "이번 주가 마지막! 풀이 과정 빠진 데 없는지 확인",
    "마감 주간",
    "서술형 · 30%"
   ],
   [
    "통합과학2",
    "과학 윤리·사회적 쟁점 탐구 · ~11월 5주 마감",
    "출처 표시까지 했는지 마지막 점검",
    "출처 표시",
    "서술형 · 30%"
   ],
   [
    "생태와 환경",
    "보고서·캠페인 · ~11월 5주 마감",
    "캠페인 활동 사진이나 기록 남겨 두기",
    "활동 기록",
    "프로젝트 · P/F"
   ],
   [
    "미술",
    "아트인퓨전 · ~12월",
    "시험 기간 전에 최대한 진도 빼 두기",
    "시험 전 진도",
    "실습 · 30%"
   ]
  ],
  "20261207": [
   [
    "미술",
    "아트인퓨전 · ~12월",
    "시험 끝나고 마무리! 완성작 사진 꼭 남기기",
    "완성작 사진",
    "실습 · 30%"
   ]
  ]
 }
};
/* ===== DATA END ===== */

const $=id=>document.getElementById(id);
const WD=["일","월","화","수","목","금","토"];
const toD=s=>new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));
const md=s=>(+s.slice(4,6))+"."+(+s.slice(6,8))+".";
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const keys=Object.keys(DATA.days).sort();
const now=new Date(), todayK=ymd(now), today0=toD(todayK);
const clean=s=>s.replace(/^\[.*?\]/,"");
const dishes=m=>m.split(/<br\s*\/?>/).map(s=>s.replace(/\s*\([\d.\s]+\)\s*/g,"").replace(/[.\s]+$/,"").trim()).filter(Boolean);

// 과목 색 (hue)
const HUE={"공통국어2":350,"공통수학2":215,"공통영어2":265,"한국사2":28,"통합사회2":45,"통합과학2":160,"과학탐구실험2":185,
  "체육2":120,"음악":300,"미술":330,"기술·가정":75,"정보":200,"생태와 환경":140,"진로와 직업":20,"자율·자치활동":0};
const hue=s=>HUE[clean(s)]??0;
const SHORT={"자율·자치활동":"자율","과학탐구실험2":"과탐실험","공통국어2":"국어","공통수학2":"수학","공통영어2":"영어","통합사회2":"통합사회","통합과학2":"통합과학","한국사2":"한국사","체육2":"체육","생태와 환경":"생태환경","기술·가정":"기가"};
const short=s=>SHORT[clean(s)]||clean(s);

const weekStart=(()=>{const d=toD(keys[0]);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);})();
const paList=DATA.pa[weekStart]||[];
const paSet=new Set(paList.map(x=>x[0]));
const focus=keys.find(k=>k>=todayK)||keys[keys.length-1]; // 오늘 또는 다음 등교일
const isExamDay=k=>{const t=DATA.days[k].tt;return t.length===1&&t[0].includes("수학능력");};

// 상단
$("title").textContent=`고운고 ${DATA.grade}학년 ${DATA.cls}반`;
$("weekPill").textContent=`${md(keys[0])} – ${md(keys[keys.length-1])}`;

// 오늘 카드
(function(){
  const d=DATA.days[focus], isToday=focus===todayK, wd=WD[toD(focus).getDay()];
  const lead=isToday?"오늘":(toD(focus)-today0===864e5?"내일":`${wd}요일`);
  const n=d.tt.length, paToday=[...new Set(d.tt.filter(s=>paSet.has(clean(s))).map(short))];
  let hi;
  if(!n) hi=`${lead}은 수업 없는 날! 푹 쉬어`;
  else if(isExamDay(focus)) hi=`${lead}은 수능 날이라 정규 수업 없어. 선배들 응원하자`;
  else hi=`${lead}${lead.endsWith("요일")?"":`(${wd})`}은 ${n}교시까지야.${paToday.length?` ${paToday.join("·")} 수행 챙기자!`:" 무난한 하루!"}`;
  $("hi").textContent=hi;
  const ex=DATA.events.find(e=>/정기시험/.test(e.n)&&toD(e.to)>=today0);
  const exN=ex?Math.round((toD(ex.from)-today0)/864e5):null;
  $("stats").innerHTML=
    `<div class="stat"><div class="num">${n||"-"}</div><span>${lead} 교시</span></div>`+
    `<div class="stat"><div class="num">${paList.length}</div><span>이번 주 수행</span></div>`+
    `<div class="stat"><div class="num">${ex?(exN>0?"D-"+exN:"D-day"):"-"}</div><span>${ex?"정기시험":"시험 없음"}</span></div>`;
})();

// 일정
(function(){
  const evs=DATA.events.filter(e=>toD(e.to||e.from)>=today0).sort((a,b)=>a.from.localeCompare(b.from));
  if(!evs.length){$("sec-ev").hidden=true;return;}
  $("ev").innerHTML=evs.map(e=>{const n=Math.round((toD(e.from)-today0)/864e5);
    const label=n>0?"D-"+n:(n===0?"오늘":"진행중");
    return `<div class="ev-row"><div class="dd ${n<=7?"soon":""}"><span class="num">${label}</span><small>${md(e.from)}${e.to&&e.to!==e.from?"~"+(+e.to.slice(6,8))+".":""}</small></div><div><b>${esc(e.n)}</b>${e.sub?`<p>${esc(e.sub)}</p>`:""}</div></div>`}).join("");
})();

// 시간표
(function(){
  $("ttRange").textContent=`${DATA.grade}-${DATA.cls}`;
  const max=Math.max(1,...keys.map(k=>DATA.days[k].tt.length));
  let h='<tr><th class="pc"></th>'+keys.map(k=>`<th class="${k===todayK?"today":""}">${WD[toD(k).getDay()]}<br><span class="num">${+k.slice(6,8)}</span></th>`).join("")+"</tr>";
  for(let p=0;p<max;p++){
    h+=`<tr><td class="pnum" style="background:none;height:auto">${p+1}</td>`;
    keys.forEach(k=>{
      const tt=DATA.days[k].tt;
      if(isExamDay(k)){if(p===0)h+=`<td class="off" rowspan="${max}">수능<br>수업<br>없음</td>`;return;}
      if(!tt.length){if(p===0)h+=`<td class="off" rowspan="${max}">쉬는 날</td>`;return;}
      const s=tt[p];
      h+=s?`<td class="${paSet.has(clean(s))?"pa":""}" style="--h:${hue(s)}">${esc(short(s))}</td>`:`<td class="empty"></td>`;
    });
    h+="</tr>";
  }
  $("tt").innerHTML=h;
})();

// 급식
(function(){
  $("meal").innerHTML=keys.map(k=>{const ms=DATA.days[k].meal||[];
    return `<div class="mday ${k===focus?"today":""}" data-k="${k}"><h3>${WD[toD(k).getDay()]}<small>${md(k)}</small></h3>`+
      (ms.length?ms.map(m=>`<div class="meal"><div class="mh"><b>${m.t}</b><span>${m.cal}kcal</span></div><ul>${dishes(m.m).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")
        :`<div class="nomeal">${isExamDay(k)?"수능 날, 급식 없어":"급식 없는 날"}</div>`)+"</div>";}).join("");
  const t=$("meal").querySelector(`[data-k="${focus}"]`);
  if(t)requestAnimationFrame(()=>{$("meal").scrollLeft=t.offsetLeft-16;});
})();

// 수행 체크 (내 폰에만 저장)
(function(){
  let done={};try{done=JSON.parse(localStorage.getItem("paDone")||"{}")}catch(_){}
  const id=x=>weekStart+"|"+x[0]+"|"+x[1];
  function draw(){
    const left=paList.filter(x=>!done[id(x)]).length;
    $("paCount").textContent=paList.length?(left?`${left}개 남음`:"다 했다!"):"";
    $("pa").innerHTML=paList.length?paList.map((x,i)=>`<label class="pa-item ${done[id(x)]?"done":""}" for="pa${i}">
      <input type="checkbox" class="chk" id="pa${i}" data-i="${i}" ${done[id(x)]?"checked":""} aria-label="${esc(x[0])} 완료">
      <div><div class="pa-head"><span class="subj" style="--h:${hue(x[0])}">${esc(x[0])}</span>${x[4]?`<span class="meta">${esc(x[4])}</span>`:""}</div>
      <div class="pa-name">${esc(x[1])}</div>${x[2]?`<div class="tip">${x[3]?`<b>${esc(x[3])}</b>`:""}${esc(x[2])}</div>`:""}</div></label>`).join("")
      :'<div class="nomeal">이번 주는 수행평가 없어. 시험 공부 집중!</div>';
  }
  $("pa").addEventListener("change",e=>{const x=paList[e.target.dataset.i];if(!x)return;done[id(x)]=e.target.checked;try{localStorage.setItem("paDone",JSON.stringify(done))}catch(_){}draw();});
  draw();
})();

// 탭바
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{$(b.dataset.go).scrollIntoView({block:"start"});});
const secs=["sec-today","sec-tt","sec-meal","sec-pa"].map($);
if("IntersectionObserver" in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.go===e.target.id));}}),{rootMargin:"-40% 0px -55% 0px"});
  secs.forEach(s=>io.observe(s));
}
</script>
</body>
</html>
