name: 주간 갱신

on:
  schedule:
    - cron: "30 21 * * *"   # 매일 06:30 (한국 시간)
  workflow_dispatch:         # Actions 화면에서 직접 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 나이스 데이터로 페이지 갱신
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python update.py
      - name: 바뀐 내용 저장
        run: |
          git config user.name "gowoon-bot"
          git config user.email "gowoon-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "주간 갱신 $(date +%F)"
          git push
