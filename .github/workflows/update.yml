name: 주간 갱신

on:
  schedule:
    # GitHub 예약 실행은 UTC 기준이고, 붐비면 늦어지거나 건너뛰기도 해서 하루 세 번 실행
    - cron: "0 22 * * *"    # 매일 07:00 (한국 시간)
    - cron: "40 0 * * *"    # 매일 09:40 (한국 시간) — 아침 실행이 빠졌을 때 대비
    - cron: "20 9 * * *"    # 매일 18:20 (한국 시간) — 저녁에 올라온 급식·시간표 반영
  workflow_dispatch:         # Actions 화면에서 직접 실행 버튼

permissions:
  contents: write

# 두 번 겹쳐 실행되지 않게
concurrency:
  group: gowoon-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEIS_KEY: ${{ secrets.NEIS_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 나이스 데이터로 페이지 갱신
        run: python update.py
      - name: 바뀐 내용 저장
        run: |
          git config user.name "gowoon-bot"
          git config user.email "gowoon-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "갱신 $(TZ=Asia/Seoul date '+%F %H:%M')"
          # 실행 중에 index.html을 직접 올렸으면, 올린 파일 위에 다시 갱신해서 저장 (충돌로 실패하지 않게)
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git reset --hard origin/main
            python update.py
            git add index.html
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "갱신 $(TZ=Asia/Seoul date '+%F %H:%M')"
          done
          exit 1
